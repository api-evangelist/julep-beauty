apis:
- aid: julep-beauty:ucp-commerce
  name: Julep UCP Commerce MCP Endpoint
  description: >-
    Julep's agent-commerce surface. The storefront advertises a Universal Commerce Protocol merchant profile
    and a live JSON-RPC Model Context Protocol endpoint covering catalog search and lookup, cart, discount,
    checkout, fulfillment, and order, with Google Pay, Shopify card, and Shop Pay payment handlers. Provided
    natively by the Shopify platform and served on Julep's own domain. Anonymous tools/list is refused:
    callers must present a resolvable UCP agent profile URI, and payment requires explicit contemporaneous
    buyer approval.
  humanURL: https://www.julep.com/agents.md
  baseURL: https://www.julep.com/api/ucp/mcp
