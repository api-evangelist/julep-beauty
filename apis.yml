aid: julep-beauty
name: Julep Beauty
description: >-
  Julep is a direct-to-consumer beauty brand selling makeup, skincare, nail polish, and
  value sets, founded in Seattle by Jane Park and backed by Andreessen Horowitz, Maveron,
  and others before its 2016 acquisition. The brand positions itself around effortless,
  low-effort beauty for women who "do a lot but don't want to spend a lot of time doing
  their makeup," with skincare inspired by its founder's Korean heritage. Julep runs its
  storefront on Shopify at www.julep.com and also sells through Amazon and Target. It is
  not an API platform and publishes no developer program, but the storefront carries a
  substantive agent-facing surface: published agent instructions at /agents.md and
  /llms.txt, a Universal Commerce Protocol merchant profile at /.well-known/ucp, a live
  MCP commerce endpoint, OpenID Connect discovery for customer accounts, and a public
  read-only catalog JSON API.
